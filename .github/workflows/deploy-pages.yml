name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "*.html"          # index.html、404.html，以及 Google Search Console 的 HTML 验证文件
      - "sitemap.xml"
      - "feed.xml"
      - "robots.txt"
      - "privacy/**"
      - "blog/**"
      - "assets/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，排队而不是互相打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect static files
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/
          # 跳过 Jekyll 构建，避免文件被二次处理
          touch _site/.nojekyll
          test -f _site/index.html || { echo "index.html missing"; exit 1; }
          echo "--- 待发布文件 ---"
          find _site -maxdepth 2 -not -path '*/.*' | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
